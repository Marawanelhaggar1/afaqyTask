<input
  type="text"
  [(ngModel)]="searchTerm"
  (ngModelChange)="onSearch($event)"
  placeholder="Search unit..."
  class="search-input"
/>

<ul class="unit-list">
  @for (unit of updatedUnits; track $index) {

  <li>
    <label>
      <input
        type="checkbox"
        [checked]="unit.visible"
        (change)="onToggleVisibility(unit, $event)"
      />
      {{ unit.name }}
    </label>
  </li>

  }
</ul>
